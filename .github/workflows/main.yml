
name: Restful-Booker CI Pipeline

on: [push, pull_request]

jobs:
  api-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cài đặt Newman
        run: npm install -g newman

      - name: Chạy bộ Test tự động
        run: newman run RestfulBooker_API_Collection.postman_collection.json -e RestfulBooker_Env.postman_environment.json
